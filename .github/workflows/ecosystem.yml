name: Ecosystem browser

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.label.name == 'test:e2e'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: macos-latest
            os: macos
          - runner: windows-latest
            os: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize package failure ledger
        shell: bash
        run: |
          mkdir -p ecosystem-ci/package-artifacts-upload
          printf '{"case":"package-%s","phases":[]}\n' '${{ matrix.os }}' > ecosystem-ci/package-artifacts-upload/phase-ledger.json
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp run artifacts
      - run: vp node ecosystem-ci/packages.ts stage --artifact-root ecosystem-ci/package-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-package-${{ matrix.os }}
          path: ecosystem-ci/package-artifacts-upload/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ecosystem-package-${{ matrix.os }}-failure
          path: ecosystem-ci/package-artifacts-upload/
          if-no-files-found: error
          retention-days: 7

  case:
    needs: package
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.label.name == 'test:e2e') }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        case: [react-vite-css, react-vite-scss, react-vite-sass, react-vite-less, next-css, next-scss, next-sass, next-less, vite-html-css, vite-html-scss, vite-html-sass, vite-html-less, vue-vite-css, media-components, media-stacked, media-workspace, media-workspace-split, production-react-vite-css, external-namechecker, external-stylized-components]
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
          - case: external-namechecker
            external: true
          - case: external-stylized-components
            external: true
    runs-on: ${{ matrix.runner }}
    env:
      CI: true
      ECOSYSTEM_EXTERNAL: ${{ matrix.external && '1' || '' }}
      ECOSYSTEM_ARTIFACT_ROOT: ecosystem-ci/case-artifacts/${{ matrix.case }}
      ECOSYSTEM_PACKAGE_ARTIFACT_ROOT: ecosystem-ci/package-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Written before any toolchain step so a setup failure still uploads an
      # attributable ledger; the lifecycle overwrites the artifact-root copy.
      - name: Initialize always-present phase ledger
        shell: bash
        run: |
          for root in "$ECOSYSTEM_ARTIFACT_ROOT" "$ECOSYSTEM_ARTIFACT_ROOT-upload"; do
            mkdir -p "$root"
            printf '{\n  "case": "%s",\n  "phases": []\n}\n' "$CASE_ID" > "$root/phase-ledger.json"
          done
        env:
          CASE_ID: ${{ matrix.case }}
      - uses: voidzero-dev/setup-vp@1b32467adbe183473499fd9d5d372c3ed9641754 # v1.18.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecosystem-package-${{ matrix.os }}
          path: ecosystem-ci/package-artifacts
      - run: vp run test:ecosystem ${{ matrix.external && '--external-case' || '--case' }} ${{ matrix.case }}
      - name: Validate reached-phase artifact allowlist
        if: always()
        run: vp node ecosystem-ci/run.ts --prepare-upload ${{ matrix.case }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ecosystem-${{ matrix.os }}-${{ matrix.case }}
          path: ecosystem-ci/case-artifacts/${{ matrix.case }}-upload/
          if-no-files-found: error
          retention-days: 7
