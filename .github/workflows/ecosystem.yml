name: Ecosystem browser

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: Run every case on every OS
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.label.name == 'test:e2e'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: macos-latest
            os: macos
          - runner: windows-latest
            os: windows
    runs-on: ${{ matrix.runner }}
    outputs:
      matrix: ${{ steps.cases.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize package failure ledger
        shell: bash
        run: |
          mkdir -p ecosystem-ci/package-artifacts-upload
          printf '{"case":"package-%s","phases":[]}\n' '${{ matrix.os }}' > ecosystem-ci/package-artifacts-upload/phase-ledger.json
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
      - run: vp install --frozen-lockfile
      # Every package leg emits the same matrix, so any successful setup can
      # supply it even when another platform fails to build its package.
      - name: Select browser cases
        id: cases
        shell: bash
        env:
          MODE: ${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'regular' }}
        run: |
          matrix="$(node ecosystem-ci/run.ts --ci-matrix "$MODE")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - run: vp run build
      - run: vp run artifacts
      - run: vp node ecosystem-ci/packages.ts stage --artifact-root ecosystem-ci/package-artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ecosystem-package-${{ matrix.os }}
          path: ecosystem-ci/package-artifacts-upload/
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ecosystem-package-${{ matrix.os }}-failure
          path: ecosystem-ci/package-artifacts-upload/
          if-no-files-found: error
          retention-days: 7

  case:
    needs: package
    if: ${{ !cancelled() && needs.package.outputs.matrix != '' && (github.event_name != 'pull_request' || github.event.label.name == 'test:e2e') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      CI: true
      CASE_ID: ${{ matrix.case }}
      ECOSYSTEM_EXTERNAL: ${{ matrix.external && '1' || '' }}
      ECOSYSTEM_ARTIFACT_ROOT: ecosystem-ci/case-artifacts/${{ matrix.case }}
      ECOSYSTEM_PACKAGE_ARTIFACT_ROOT: ecosystem-ci/package-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Written before any toolchain step so a setup failure still uploads an
      # attributable ledger; the lifecycle overwrites the artifact-root copy.
      - name: Initialize always-present phase ledger
        shell: bash
        run: |
          for root in "$ECOSYSTEM_ARTIFACT_ROOT" "$ECOSYSTEM_ARTIFACT_ROOT-upload"; do
            mkdir -p "$root"
            printf '{\n  "case": "%s",\n  "phases": []\n}\n' "$CASE_ID" > "$root/phase-ledger.json"
          done
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp exec playwright install chromium
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ecosystem-package-${{ matrix.os }}
          path: ecosystem-ci/package-artifacts
      - shell: bash
        run: vp run test:ecosystem ${{ matrix.external && '--external-case' || '--case' }} "$CASE_ID"
      - name: Validate reached-phase artifact allowlist
        if: always()
        shell: bash
        run: vp node ecosystem-ci/run.ts --prepare-upload "$CASE_ID"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ecosystem-${{ matrix.os }}-${{ matrix.case }}
          path: ecosystem-ci/case-artifacts/${{ matrix.case }}-upload/
          if-no-files-found: error
          retention-days: 7
