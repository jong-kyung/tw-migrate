# Stage one: turn a version into a reviewable bump PR. Merging that PR is what
# actually starts a release -- see release.yml, which triggers on a package.json
# version change landing on main.
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without a leading v (e.g. 0.1.0 or 0.1.0-alpha.0)'
        required: true
        type: string

permissions: {}

# Keyed on the requested version: GitHub keeps only one pending run per group,
# so a constant group would let a third dispatch drop a second one still queued,
# and that version would never get a PR.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Open release PR
    if: github.repository == 'jong-kyung/tw-migrate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Pinned to main regardless of the ref the dispatch was launched from.
      # The release branch is cut from whatever is checked out here, and this
      # PR deliberately does not run CI, so branching off a feature ref would
      # let unverified commits ride into a release.
      - uses: actions/checkout@v7
        with:
          ref: main

      # Round-tripped through a real parser rather than matched with a character
      # class, which would accept forms Cargo rejects (empty prerelease
      # identifiers like 1.2.3-alpha..1, leading zeroes). Requiring the output to
      # equal the input also rejects a leading v, which the parser would happily
      # normalise away and which would produce a vv<version> tag at release time.
      # This PR skips CI by design, so an unparseable version would otherwise
      # reach main before anything noticed.
      - name: Validate version
        run: |
          set -euo pipefail
          normalised="$(npx --yes -p semver@7.7.2 semver "$VERSION" || true)"
          if [ "$normalised" != "$VERSION" ]; then
            echo "::error::Version must be bare semver without a leading v (got '$VERSION')"
            exit 1
          fi

      # Every file that carries the version: the root manifest, the five
      # platform manifests, the crate, and the crate's lockfile entry. The
      # optionalDependencies stay on workspace:*; napi rewrites them to a
      # concrete version at publish time.
      - name: Bump versions
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const version = process.env.VERSION;

            const manifests = ["package.json", ...fs.readdirSync("npm").map((dir) => `npm/${dir}/package.json`)];
            for (const file of manifests) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"));
              pkg.version = version;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n");
            }

            const cargo = "crates/tw_migrate/Cargo.toml";
            fs.writeFileSync(cargo, fs.readFileSync(cargo, "utf8").replace(/^version = "[^"]*"$/m, `version = "${version}"`));

            const lock = "Cargo.lock";
            fs.writeFileSync(lock, fs.readFileSync(lock, "utf8").replace(/(\[\[package\]\]\nname = "tw-migrate"\nversion = ")[^"]*/, `$1${version}`));
          '

      - name: Verify bump
        run: |
          set -euo pipefail
          for file in package.json npm/*/package.json; do
            actual="$(node -p "require('./$file').version")"
            if [ "$actual" != "$VERSION" ]; then
              echo "::error::$file is at $actual, expected $VERSION"
              exit 1
            fi
          done
          grep -qF "version = \"$VERSION\"" crates/tw_migrate/Cargo.toml \
            || { echo "::error::crates/tw_migrate/Cargo.toml was not updated"; exit 1; }
          node -e '
            const fs = require("node:fs");
            const entry = fs.readFileSync("Cargo.lock", "utf8").match(/\[\[package\]\]\nname = "tw-migrate"\nversion = "([^"]*)"/);
            if (entry?.[1] !== process.env.VERSION) {
              console.log(`::error::Cargo.lock is at ${entry?.[1]}, expected ${process.env.VERSION}`);
              process.exit(1);
            }
          '
          echo 'Files changed:'
          git diff --name-only

      # This PR is authored with GITHUB_TOKEN, so it will not trigger CI. That
      # is acceptable: the diff is version strings only, and both CI and the
      # release build matrix run on the merge commit.
      - name: Open release PR
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add package.json npm/*/package.json crates/tw_migrate/Cargo.toml Cargo.lock
          git commit -m "release: v$VERSION"
          # Force-with-lease so a rerun can recover: if PR creation failed last
          # time, the branch is already on the remote and a rerun builds a
          # different commit from main, which a plain push would reject as a
          # non-fast-forward and leave stuck until someone deleted the branch by
          # hand. Fetching first is what gives the lease something to compare
          # against on a branch this run has never seen.
          git fetch origin "$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          git push --force-with-lease origin "$branch"

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          Bumps every version-bearing file to $VERSION.

          Merging this PR triggers the release workflow, which builds all five native targets and then waits for approval in the release environment before anything is published to npm.

          CI does not run on this PR because it was authored by GITHUB_TOKEN. Confirm CI is green on the merge commit before approving the release run.
          EOF

          # npm renders the root README on the package page, so a warning that
          # the package is not published yet has to go before the first release
          # ships -- and only then. The check is against the file rather than a
          # version, so this reminder disappears by itself once it is done.
          if grep -q 'Not on npm yet' README.md; then
            cat >> "$body_file" <<'EOF'

          **Before merging:** remove the "Not on npm yet" warning from `README.md` -- npm publishes that README onto the package page, where it would tell users the CLI they just installed does not exist.
          EOF
          fi

          # Reuse the PR if one is already open for this branch, so a rerun
          # after a partial failure updates it instead of erroring out.
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "release: v$VERSION" --body-file "$body_file"
            echo "Updated existing PR #$existing"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "release: v$VERSION" \
              --body-file "$body_file"
          fi
