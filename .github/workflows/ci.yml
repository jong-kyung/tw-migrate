name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      full:
        description: Run the full API suite on all five platforms
        type: boolean
        default: true
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  duplication:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: kucherenko/jscpd@b4cdcc250df0aaa9c3a8d2ba57f26e4c6510a909 # v5.2.0
        with:
          version: 5.2.0
          path: src crates ecosystem-ci test
          ignore: '**/fixtures/**,crates/snapshots/snapshots/**'
          baseline-from-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          fail-on-new-clones: true
          upload-sarif: false

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run knip

  cargo-shear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-shear
      - run: cargo shear

  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14
          - macos-15-intel
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
      - run: vp install --frozen-lockfile
      - run: vp run typecheck
      - name: Run full tests
        if: matrix.runner == 'ubuntu-latest' || github.event_name == 'schedule' || inputs.full
        run: vp run test
      - name: Run platform contracts
        if: matrix.runner != 'ubuntu-latest' && github.event_name != 'schedule' && !inputs.full
        shell: bash
        run: |
          cargo test
          vp run build:debug
          vp test --exclude test/migrate.test.ts
          vp test test/migrate.test.ts -t 'aliased cwd|separators|symlink|staging failure|CRLF|authored bytes|byte-exactly|fatal integrity|vanishing during Vue'
      - run: vp run build
      - run: vp run artifacts
      # Runs on every supported target, not a subset: packaging mistakes are
      # platform-specific, and this is the last gate before the release
      # workflow packs the same tarballs for real.
      - name: Install packed packages and run the CLI
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$(mktemp -d)"
          # Publishing rewrites workspace:* optionalDependencies to concrete
          # versions (napi prepublish); mirror that so the packed tarball
          # resolves like the published package would.
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const key of Object.keys(pkg.optionalDependencies ?? {})) {
              pkg.optionalDependencies[key] = pkg.version;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          npm pack --pack-destination "$pack_dir"
          git checkout -- package.json
          platform_dir="$(for dir in npm/*/; do if ls "$dir"*.node >/dev/null 2>&1; then echo "$dir"; fi; done)"
          npm pack "./$platform_dir" --pack-destination "$pack_dir"

          # setup-vp resolves the pinned pnpm for its own commands but does not
          # put it on PATH, and this check deliberately drives pnpm the way a
          # consumer would. Version comes from packageManager so it cannot drift.
          pnpm_version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@$pnpm_version"

          # The platform package is installed explicitly because these are
          # local tarballs; optional resolution is skipped so neither client
          # tries to fetch an unpublished tw-migrate-* from the registry.
          npm_dir="$(mktemp -d)"
          cd "$npm_dir"
          npm init -y >/dev/null
          npm install --omit=optional "$pack_dir"/*.tgz
          npx --no-install tw-migrate --help

          pnpm_dir="$(mktemp -d)"
          cd "$pnpm_dir"
          npm init -y >/dev/null
          pnpm add --no-optional "$pack_dir"/*.tgz
          pnpm exec tw-migrate --help

  packaged-cli-snapshots:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.1
      - run: vp install --frozen-lockfile
      - run: vp run snapshots:prepare
      - name: Install snapshot review CLI
        if: runner.os == 'Linux'
        run: cargo install cargo-insta --version 1.48.0 --locked
      - name: Run snapshots and reject pending or unreferenced files
        if: runner.os == 'Linux'
        run: cargo insta test --check --unreferenced reject -p tw-migrate-snapshots
      - name: Run snapshots
        if: runner.os != 'Linux'
        run: cargo test -p tw-migrate-snapshots
