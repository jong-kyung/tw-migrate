# Stage two: a version bump landing on main releases that version. Start a
# release with the Prepare Release workflow rather than by editing package.json
# by hand.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']

permissions: {}

# Keyed on the commit, not the workflow: GitHub keeps only one pending run per
# group, so a constant group would let a third release cancel a second one that
# is still queued behind an approval, and that version would never be built.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  check:
    name: Check version
    if: github.repository == 'jong-kyung/tw-migrate'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is this a new version to release?
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/check-release.sh "$BEFORE"

  # Full coverage is deferred from regular CI, never from publication.
  ci:
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  ecosystem:
    needs: check
    if: needs.check.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ecosystem.yml
    with:
      full: true

  # Built from the release commit rather than reused from the CI run, so the
  # provenance of the published binaries does not depend on artifact retention.
  # The full CI and ecosystem jobs above gate publication on this same commit.
  build:
    name: Build ${{ matrix.runner }}
    needs: check
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14
          - macos-15-intel
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.99.1
      - run: vp install --frozen-lockfile
      - run: vp run build
      - run: vp run artifacts
      # The whole npm/ directory, not a glob over the addon: upload-artifact
      # roots an artifact at the common ancestor of the matched files, so a
      # single-file glob would drop the npm/<platform>/ prefix the publish job
      # needs to put each addon back where napi expects it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.runner }}
          path: npm
          if-no-files-found: error
      # The publish job checks out fresh and installs nothing, so the bundled
      # dist/ the root package points main and bin at must arrive as an
      # artifact too. The bundle is platform-independent; one leg uploads it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.runner == 'ubuntu-latest'
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # Nothing reaches npm until a reviewer approves this job in the release
  # environment: npm cannot republish a version, unpublish expires after 72
  # hours, and one publish run pushes all six packages.
  publish:
    name: Publish
    needs: [check, build, ci, ecosystem]
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: release
    # Serializes publishing across releases. The workflow-level group is keyed
    # per commit so no queued release is dropped, which on its own would let two
    # approved publishes interleave: both read the same dist-tag, both pass the
    # check below, and whichever finishes last owns the tag. This group is the
    # shared lock that makes check-then-publish atomic between releases.
    # Residual: GitHub keeps one pending member per group, so a third publish
    # queued behind two others would still be dropped -- visible as a missing
    # release rather than a silent tag move, and re-runnable.
    concurrency:
      group: publish-tw-migrate
      cancel-in-progress: false
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC exchange with npm, and provenance
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No NODE_AUTH_TOKEN: each of the six packages names this repository,
      # this workflow file, and the release environment as its trusted
      # publisher on npmjs.com, and the npm CLI exchanges the OIDC token from
      # id-token: write for a short-lived credential. There is no long-lived
      # npm token to leak or rotate.
      #
      # setup-node still runs -- it is what points npm at the public registry.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          registry-url: 'https://registry.npmjs.org'

      # Node 22.18.0 ships npm 10.9.x, which runs the prepare lifecycle on
      # publish even when --ignore-scripts is passed, and which predates OIDC
      # support entirely. npm 11 honours the flag and can exchange the OIDC
      # token; trusted publishing requires 11.5.1 or newer.
      - name: Use an npm that supports OIDC and honours --ignore-scripts
        run: npm install --global npm@11.13.0

      - name: Download native addons
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: npm

      - name: Download the bundled JavaScript
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Verify the published entrypoints and every target are present
        run: bash .github/scripts/verify-release-artifacts.sh

      - name: Verify release tag and publish packages
        run: bash .github/scripts/publish-packages.sh "$VERSION"

      # If this fails after a successful publish, rerunning the workflow will
      # not retry it -- the version is on npm, so the check job stops the run.
      # Recover by hand:
      #   gh release create "v<version>" --generate-notes --target <sha>
      - name: Create GitHub Release
        run: bash .github/scripts/create-github-release.sh "$VERSION" "$tag"

  # Installs what users install. CI's packed check proves the tarballs are
  # well-formed, but it installs local files with optional resolution off, so
  # it never exercises the optionalDependencies path that picks the right
  # platform package out of the registry. A failure here is a real defect
  # report; it does not and cannot undo the publish above.
  smoke:
    name: Smoke ${{ matrix.runner }}
    needs: [check, publish]
    if: needs.check.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-14
          - macos-15-intel
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.15.1

      - name: Install the published version and exercise migration
        shell: bash
        run: bash .github/scripts/smoke-package.sh "$VERSION"
