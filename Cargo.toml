[workspace]
resolver = "3"
members = ["crates/*"]
default-members = [
  "crates/tw_migrate",
  "crates/tw_migrate_error",
  "crates/tw_migrate_css",
  "crates/tw_migrate_source",
  "crates/tw_migrate_planner",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
insta = "=1.48.0"
napi = { version = "3.12.0", default-features = false, features = ["napi9"] }
napi-build = "2.4.0"
napi-derive = "3.6.2"
oxc-css-parser = "0.0.11"
oxc_allocator = "0.144.0"
oxc_ast = "0.144.0"
oxc_ast_visit = "0.144.0"
oxc_parser = "0.144.0"
oxc_semantic = "0.144.0"
oxc_sourcemap = "8.1.2"
oxc_span = "0.144.0"
oxc_syntax = "0.144.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
tw_migrate_error = { path = "crates/tw_migrate_error" }
tw_migrate_css = { path = "crates/tw_migrate_css" }
tw_migrate_source = { path = "crates/tw_migrate_source" }
tw_migrate_planner = { path = "crates/tw_migrate_planner" }
